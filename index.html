<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ePub Creator Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-book-open logo-icon"></i>
                <span class="logo-text">Web ePub Creator Pro</span>
            </div>
            
            <div class="controls">
                <button id="theme-toggle" class="control-btn">
                    <i class="fa-solid fa-moon"></i>
                </button>
                <button id="lang-toggle" class="control-btn">EN</button>
            </div>
        </header>

        <div class="user-info">
            <span class="user-email"><i class="fa-regular fa-user"></i> naing5588@icloud.com</span>
            <span class="badge-premium"><i class="fa-solid fa-crown"></i> Premium</span>
        </div>

        <div class="card backup-section">
            <h3 id="backup-title">စာအုပ် BACKUP စီမံခန့်ခွဲမှု</h3>
            
            <button class="btn btn-green">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span id="btn-backup">လက်ရှိစာအုပ်ကို ဖိုင်သိမ်းဆည်းမည် (Backup)</span>
            </button>
            
            <button class="btn btn-blue">
                <i class="fa-solid fa-file-arrow-up"></i>
                <span id="btn-load">စာအုပ်ဖောင်း ပြန်တင်မည် (Load Backup)</span>
            </button>
            
            <button class="btn btn-red">
                <i class="fa-solid fa-trash-can"></i>
                <span id="btn-reset">စာအုပ်အသစ်အတွက် အစကပြန်စမည် (Reset)</span>
            </button>
        </div>

        <div class="form-group">
            <label id="label-title">စာအုပ်အမည် (Book Title)</label>
            <input type="text" id="book-title" placeholder="သုမ... ဖြစ်တည်မှု အပိုင်းအစများ">
        </div>

        <div class="form-group">
            <label id="label-author">စာရေးဆရာ (Author)</label>
            <input type="text" id="book-author" placeholder="သဘောတရား ဆရာလေးတစ်ရွာ">
        </div>

        <div class="form-group">
            <label id="label-cover">မျက်နှာဖုံးပုံ (Cover Image)</label>
            <div class="file-input-wrapper">
                <button class="btn-file" id="btn-choose">Choose File</button>
                <span class="file-name" id="no-file">No file selected</span>
            </div>
        </div>

        <div class="chapters-section">
            <label id="label-chapters">အခန်းများ (Chapters)</label>
            <button class="btn-add-chapter">
                <i class="fa-solid fa-plus"></i>
                <span id="btn-add-chapter">အခန်းတိုးမည် (Add Chapter)</span>
            </button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web ePub Creator Pro</title>
    
    <style>
        body {
            font-family: sans-serif;
            background-color: #121824;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: #1a2333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #ffcc00;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #a0aec0;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #2d3748;
            border-radius: 5px;
            background-color: #2d3748;
            color: #fff;
            box-sizing: border-box;
        }
        textarea {
            height: 120px;
            resize: vertical;
        }
        .btn-epub {
            width: 100%;
            padding: 15px;
            background-color: #f0a500;
            color: #000;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        .btn-epub:hover {
            background-color: #d49200;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

    <div class="container">
        <h2>📚 Web ePub Creator</h2>
        
        <div class="form-group">
            <label>စာအုပ်အမည် (Book Title)</label>
            <input type="text" id="bookTitle" value="သူမ . . ဖြစ်တည်မှု အပိုင်းအစများ">
        </div>

        <div class="form-group">
            <label>စာရေးဆရာ (Author)</label>
            <input type="text" id="author" value="သဘာဝဓမ္မကဗျာ ဆရာလေးဥာဏ်စုစု">
        </div>

        <div class="form-group">
            <label>အခန်းခေါင်းစဉ် (Chapter Title)</label>
            <input type="text" id="chapterTitle" value="သူမ . . ဖြစ်တည်မှု အပိုင်းအစများ (၅၉)">
        </div>

        <div class="form-group">
            <label>အခန်းတွင်းစာသား (Chapter Content)</label>
            <textarea id="chapterContent"><p>ဒီနေရာမှာ စာအုပ်ရဲ့ အခန်းတွင်း အကြောင်းအရာတွေကို ရေးသားနိုင်ပါတယ်။</p></textarea>
        </div>

        <button id="download-epub" class="btn-epub">📥 ePub ဖိုင် ထုတ်ယူမည်</button>
    </div>

    <script>
        document.getElementById('download-epub').addEventListener('click', async () => {
            // Input Boxes တွေထဲက စာသားတွေကို လှမ်းယူမယ်
            const bookTitle = document.getElementById('bookTitle').value.trim() || "Untitled Book";
            const author = document.getElementById('author').value.trim() || "Unknown Author";
            const chTitle = document.getElementById('chapterTitle').value.trim() || "Chapter 1";
            const chContent = document.getElementById('chapterContent').value.trim() || "<p></p>";

            // JSZip instant အသစ်တစ်ခု ဆောက်မယ်
            const zip = new JSZip();

            // ၁။ mimetype ဖိုင်ထည့်ခြင်း (မဖြစ်မနေ လိုအပ်ပြီး compress မလုပ်ရပါ)
            zip.file("mimetype", "application/epub+zip", { compression: "STORE" });

            // ၂။ META-INF/container.xml ဖိုင် ထည့်ခြင်း
            const containerXml = `<?xml version="1.0" encoding="UTF-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container">
    <rootfiles>
        <rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/>
    </rootfiles>
</container>`;
            zip.folder("META-INF").file("container.xml", containerXml);

            // OEBPS Folder ဆောက်ခြင်း
            const oebps = zip.folder("OEBPS");

            // ၃။ အခန်းကို HTML (XHTML) ဖိုင်အဖြစ် ပြောင်းလဲထည့်သွင်းခြင်း
            const fileName = "chapter_1.xhtml";
            const fullChapterHtml = `<?xml version="1.0" encoding="utf-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>${chTitle}</title>
    <style>
        body { font-family: sans-serif; padding: 5%; line-height: 1.6; }
        h2 { text-align: center; color: #333333; }
    </style>
</head>
<body>
    <h2>${chTitle}</h2>
    <div>${chContent}</div>
</body>
</html>`;
            
            oebps.file(fileName, fullChapterHtml);

            // ၄။ OEBPS/content.opf (ePub ရဲ့ 뼈대 Metadata ဖိုင်) တည်ဆောက်ခြင်း
            const contentOpf = `<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="bookid" version="2.0">
    <metadata xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:opf="http://www.idpf.org/2007/opf">
        <dc:title>${bookTitle}</dc:title>
        <dc:creator opf:role="aut">${author}</dc:creator>
        <dc:language>my</dc:language>
        <dc:identifier id="bookid">urn:uuid:${Math.random().toString(36).substring(2)}</dc:identifier>
    </metadata>
    <manifest>
        <item id="ch_1" href="${fileName}" media-type="application/xhtml+xml"/>
    </manifest>
    <spine toc="ncx">
        <itemref idref="ch_1"/>
    </spine>
</package>`;
            
            oebps.file("content.opf", contentOpf);

            // ၅။ ePub ဖိုင်ချုပ်ပြီး iPhone ပေါ်မှာ ဒေါင်းလုဒ်ချခြင်း
            zip.generateAsync({ type: "blob" }).then(function (content) {
                const fileURL = URL.createObjectURL(content);
                
                // iPhone (iOS Safari) မှာ Security ကြောင့် block မဖြစ်အောင် window.location သုံးပြီး တန်းပွင့်ခိုင်းတာဖြစ်ပါတယ်
                const link = document.createElement('a');
                link.href = fileURL;
                link.download = `${bookTitle}.epub`;
                
                // ဖုန်းအတွက် ပိုစိတ်ချရမယ့် ဒေါင်းလုဒ်နည်းလမ်း
                if (navigator.userAgent.match(/iPhone|iPad|iPod/i)) {
                    window.location.href = fileURL;
                } else {
                    link.click();
                }
            }).catch(err => {
                alert("ePub ထုတ်ယူရာတွင် အမှားအယွင်းရှိပါသည်။ " + err);
            });
        });
    </script>
</body>
</html>
